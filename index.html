<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>SFX HEATMAP</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:#050816;
    color:white;
    overflow-x:hidden;
}

/* =========================
BACKGROUND
========================= */

.bg{
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at top left,#00ffcc22,transparent 35%),
    radial-gradient(circle at bottom right,#ff005522,transparent 35%),
    #050816;
    z-index:-1;
}

/* =========================
HEADER
========================= */

header{
    width:100%;
    padding:30px 20px 20px;
    position:relative;
}

.logo-wrap{
    display:flex;
    align-items:center;
    gap:18px;
}

.logo{
    width:85px;
    height:85px;
    border-radius:22px;
    background:linear-gradient(135deg,#1cffc6,#18bfff);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    font-weight:800;
    color:#000;
}

.title h1{
    font-size:55px;
    font-weight:800;
}

.title p{
    font-size:24px;
    opacity:.8;
    margin-top:6px;
}

/* =========================
HOME BUTTON
========================= */

.home-wrapper{
    position:absolute;
    top:35px;
    right:25px;
    z-index:999;
}

.home-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;

    padding:15px 28px;
    border:none;
    border-radius:18px;

    background:linear-gradient(135deg,#1cffc6,#18bfff);

    color:white;
    font-size:18px;
    font-weight:700;

    cursor:pointer;

    box-shadow:
    0 0 25px rgba(0,255,200,.25);

    transition:.3s;
}

.home-btn:hover{
    transform:translateY(-2px);
}

.home-dropdown{
    position:absolute;
    top:72px;
    right:0;

    width:260px;

    background:rgba(12,12,20,.95);
    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.08);

    border-radius:22px;

    padding:12px;

    display:none;
    flex-direction:column;
    gap:10px;

    box-shadow:
    0 15px 50px rgba(0,0,0,.45);
}

.home-dropdown.active{
    display:flex;
}

.home-dropdown a{
    text-decoration:none;
    color:white;

    background:rgba(255,255,255,.04);

    padding:16px 18px;

    border-radius:14px;

    font-size:15px;
    font-weight:600;

    transition:.25s;
}

.home-dropdown a:hover{
    background:rgba(0,255,200,.15);
    transform:translateX(4px);
}

/* =========================
PAIR BUTTONS
========================= */

.pairs{
    display:flex;
    gap:18px;
    padding:10px 20px 30px;
    flex-wrap:wrap;
}

.pair-btn{
    padding:18px 35px;
    border-radius:22px;

    background:rgba(255,255,255,.04);

    border:1px solid rgba(255,255,255,.08);

    font-size:28px;
    color:white;

    cursor:pointer;
}

.pair-btn.active{
    background:linear-gradient(135deg,#1cffc6,#18bfff);
    color:#000;
    font-weight:700;
}

/* =========================
CARDS
========================= */

.container{
    padding:0 20px 40px;
}

.card{
    width:100%;

    background:rgba(255,255,255,.03);

    border:1px solid rgba(255,255,255,.07);

    border-radius:34px;

    padding:38px;

    margin-bottom:28px;

    backdrop-filter:blur(10px);

    box-shadow:
    inset 0 1px 1px rgba(255,255,255,.05);
}

.card h3{
    font-size:30px;
    opacity:.75;
    margin-bottom:18px;
}

.card h1{
    font-size:76px;
    font-weight:800;
}

.bullish{
    color:#1cff8e;
}

/* =========================
MOBILE
========================= */

@media(max-width:768px){

    header{
        padding-top:22px;
    }

    .logo{
        width:58px;
        height:58px;
        font-size:22px;
        border-radius:16px;
    }

    .title h1{
        font-size:32px;
    }

    .title p{
        font-size:16px;
    }

    .home-wrapper{
        top:20px;
        right:18px;
    }

    .home-btn{
        padding:11px 18px;
        border-radius:14px;
        font-size:13px;
    }

    .home-dropdown{
        width:210px;
        top:58px;
        border-radius:18px;
    }

    .home-dropdown a{
        padding:14px;
        font-size:13px;
    }

    .pairs{
        gap:10px;
    }

    .pair-btn{
        flex:1;
        text-align:center;
        font-size:18px;
        padding:14px;
        border-radius:18px;
    }

    .card{
        border-radius:24px;
        padding:26px;
    }

    .card h3{
        font-size:20px;
    }

    .card h1{
        font-size:48px;
    }

}

</style>
</head>
<body>

<div class="bg"></div>

<!-- HEADER -->

<header>

    <div class="logo-wrap">

        <div class="logo">
            SFX
        </div>

        <div class="title">
            <h1>SFX HEATMAP</h1>
            <p>Institutional Options Flow</p>
        </div>

    </div>

    <!-- HOME -->

    <div class="home-wrapper">

        <button class="home-btn" onclick="toggleMenu()">
            HOME ☰
        </button>

        <div class="home-dropdown" id="homeMenu">

            <a href="#">📅 Economic Calendar</a>

            <a href="#">👥 Community</a>

            <a href="#">📊 Market Sentiment</a>

            <a href="#">💬 Support</a>

        </div>

    </div>

</header>

<!-- PAIRS -->

<div class="pairs">

    <button class="pair-btn active">
        EURUSD
    </button>

    <button class="pair-btn">
        GBPUSD
    </button>

    <button class="pair-btn">
        USDJPY
    </button>

</div>

<!-- CONTENT -->

<div class="container">

    <div class="card">
        <h3>CALL VOLUME</h3>
        <h1>742K</h1>
    </div>

    <div class="card">
        <h3>PUT VOLUME</h3>
        <h1>528K</h1>
    </div>

    <div class="card">
        <h3>SENTIMENT</h3>
        <h1 class="bullish">Bullish</h1>
    </div>

    <div class="card">
        <h3>LIVE PRICE</h3>
        <h1>1.0816</h1>
    </div>

</div>

<script>

function toggleMenu(){
    document
    .getElementById("homeMenu")
    .classList.toggle("active");
}

window.addEventListener("click", function(e){

    const menu =
    document.getElementById("homeMenu");

    const button =
    document.querySelector(".home-btn");

    if(
        !menu.contains(e.target)
        &&
        !button.contains(e.target)
    ){
        menu.classList.remove("active");
    }

});

</script>

</body>
</html>
