<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SFX HEATMAP</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://s3.tradingview.com/tv.js"></script>

</head>

<body>

<div class="sidebar">

    <div class="logo">
        SFX
    </div>

    <a href="#">Dashboard</a>
    <a href="#">Heatmap</a>
    <a href="#">Forex</a>
    <a href="#">Crypto</a>
    <a href="#">Signals</a>

</div>

<div class="main">

    <div class="topbar">

        <div class="market-live">
            LIVE MARKET
        </div>

        <button class="premium-btn">
            PREMIUM
        </button>

    </div>

    <div class="grid-layout">

        <div class="chart-box">

            <div id="tradingview_chart"></div>

        </div>

        <div class="market-panel">

            <div class="pair-card active">
                EUR/USD
            </div>

            <div class="pair-card">
                BTC/USD
            </div>

            <div class="pair-card">
                XAU/USD
            </div>

            <div class="pair-card">
                SOL/USD
            </div>

        </div>

    </div>

    <div class="heatmap-box">

        <iframe
            src="https://www.tradingview.com/heatmap/crypto/"
            frameborder="0">
        </iframe>

    </div>

</div>

<!-- Firebase -->
<script type="module" src="./firebase.js"></script>

<!-- Main App -->
<script type="module" src="./app.js"></script>

</body>
</html>
